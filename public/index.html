<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="作业与E-test，教师学生操作平台" />
    <title>HomeworkPage · Login</title>
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-layout">
        <div class="auth-hero">
          <span class="tiny-pill">✦ Updated: 新求精系列</span>
          <h1>Explore. Learn. Grow.</h1>
          <p>
            探索 · 学习 · 成长
          </p>
        </div>
        <div class="auth-panel">
          <p class="eyebrow">Welcome back</p>
          <h2>登录</h2>
          <p>欢迎回来。</p>
          <form id="login-form" class="form-grid">
            <div class="field">
              <label for="username">用户名</label>
              <input
                class="input"
                id="username"
                name="username"
                autocomplete="username"
                required
              />
            </div>
            <div class="field">
              <label for="password">密码</label>
              <input
                class="input"
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
            <div id="login-message" class="notice notice-error hidden" role="alert"></div>
            <button class="button button-primary button-wide" type="submit">登录</button>
          </form>
          <div class="auth-links">
            <a href="/activate.html">第一次使用？激活学生账号</a>
            <span class="helper">测试版</span>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/assets/login.js"></script>
  </body>
</html>
